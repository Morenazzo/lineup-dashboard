<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>__LINEUP_TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=Open+Sans:wght@300;400&display=swap">
<style>
/* Layout: a daily standup. Morning: one short form.
   After saving: today's goals to check off, the week, and the MRR chart. The rest folds away.
   A single dark theme. The colors are CSS variables; lineup.config.ts (theme) can override them. */
:root{
  color-scheme: dark;
  --abyss:#001639; --navy:#003453; --reef:#00586A; --blue:#0050A0;
  --foam:#0BB7B7; --aqua:#19D7C7; --sky:#009FD5; --coral:#ED4A6D; --lilac:#9D80B9; --blush:#E2AAC4; --sand:#FFD08D; --mint:#6AE1CC;
  --ink:#F5FDFF; --mute:#93AABA; --line:rgba(140,215,230,.14);
  --card:linear-gradient(155deg,rgba(6,57,83,.83),rgba(3,34,67,.94));
  --well:rgba(0,22,49,.53);
  --f-display:"DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body:"Open Sans", "DM Sans", ui-sans-serif, system-ui, sans-serif;
  --f-mono:"DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--abyss);color:var(--ink)}
body{font-family:var(--f-display);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 90px;
  background:radial-gradient(ellipse at 69% 0%,rgba(0,111,138,.21),transparent 45%),linear-gradient(140deg,#001D3C,#001734 55%,#001A35) fixed,var(--abyss)}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:19px;font-weight:800;letter-spacing:-.3px}
h3{font-size:15px;font-weight:800}
p{margin:0}
.help{font-family:var(--f-body);font-weight:300;color:var(--mute);font-size:13.5px;max-width:65ch}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--foam);font-weight:800}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sand);outline-offset:2px;border-radius:6px}

/* header */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:14px 12px}
.top img{height:44px;width:auto;display:block}
.hello{flex:1 1 200px;min-width:0}
.hello b{display:block;font-size:18px;font-weight:800;letter-spacing:-.3px}
.hello span{color:var(--mute);font-size:13px}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:20px;font-size:12.5px;white-space:nowrap;font-weight:700;border:1px solid rgba(110,204,218,.2);background:rgba(6,45,70,.44);color:#B1D5DD}
.chip.streak{color:var(--sand);border-color:rgba(255,208,141,.32)}
.chip.perfect{color:var(--mint);border-color:rgba(106,225,204,.3)}
.chip.save{color:var(--mute);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.dot.ok{background:var(--foam)}.dot.busy{background:var(--sand)}.dot.off{background:var(--coral)}

/* scene */
.scene{position:relative;border-radius:20px;overflow:hidden;min-height:250px;background:#073857;border:1px solid var(--line);box-shadow:0 16px 55px rgba(0,9,30,.21)}
.scene canvas{display:block;width:100%;height:250px}
.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:18px}
.critical{text-shadow:0 1px 12px rgba(0,22,57,.6);max-width:640px}
.big{font-family:var(--f-display);font-size:clamp(52px,11vw,92px);font-weight:800;line-height:1;letter-spacing:-3px;font-variant-numeric:tabular-nums;text-shadow:0 2px 22px rgba(0,22,57,.55),0 0 36px rgba(159,233,223,.18)}
.big small{font-size:.25em;color:#8FBBC8;letter-spacing:0;font-weight:700}
.sub{font-size:13.5px;margin-top:6px}
.bottom{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:flex-end}
.pill{background:rgba(0,26,57,.65);backdrop-filter:blur(10px);border:1px solid rgba(203,251,255,.2);border-radius:12px;padding:8px 12px;font-size:12px}
.pill b{font-family:var(--f-mono);font-weight:500;color:var(--sand)}
.pill.xl{display:flex;flex-direction:column;gap:2px;padding:10px 16px;border-color:rgba(255,208,141,.45);font-size:12.5px}
.pill.xl b{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.05;letter-spacing:-1px}
.pill.xl small{font-size:13px;font-weight:700;color:#8FBBC8;letter-spacing:0}
.goal{display:flex;flex-direction:column;gap:8px;margin-block:14px 18px}
.goal-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13.5px}
.goal-row b{font-family:var(--f-mono);font-weight:500}
.gbar{height:10px;border-radius:50px;background:#002642;overflow:hidden}
.gbar i{display:block;height:100%;border-radius:50px;background:linear-gradient(90deg,var(--blue),var(--foam),#87E3C4);transition:width .7s ease}

/* layout + cards */
.cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:0 16px 55px rgba(0,9,30,.21)}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.banner{padding:10px 14px;border-radius:12px;background:rgba(255,208,141,.1);border:1px solid rgba(255,208,141,.4);font-size:13px;margin-bottom:14px}

/* standup form */
.standup{border-color:rgba(28,211,211,.3)}
.su-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.su-sym{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#FFD08D,#ED9470);color:#003450;display:grid;place-items:center;font-size:24px;flex:0 0 auto}
.su-sec{display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:14px;background:rgba(0,28,59,.38);border:1px solid rgba(137,207,220,.12)}
.su-sec > .eyebrow{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.su-sec > .eyebrow span{color:var(--mute);letter-spacing:.04em;text-transform:none;font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#C9E3EA;font-weight:700;min-width:0}
.f small{font-weight:400;color:var(--mute);margin-left:4px}
.qlabel{font-size:13px;color:#C9E3EA;font-weight:700}
.in{background:var(--well);border:1px solid rgba(148,206,224,.2);border-radius:10px;padding:10px 12px;color:var(--ink);width:100%;min-width:0;font-weight:400}
.in::placeholder{color:#607E95}
textarea.in{resize:vertical;min-height:72px;font-family:var(--f-body);line-height:1.55}
.in:focus{border-color:var(--foam);outline:none}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid rgba(111,201,222,.25);background:rgba(7,59,87,.7);font-size:20px;cursor:pointer}
.stepper button:hover{border-color:var(--foam)}
.stepper input{width:72px;text-align:center;font-family:var(--f-mono);font-size:20px}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid rgba(111,201,222,.25);background:rgba(7,59,87,.55);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:13px;font-weight:700;color:#DDF3F7}
.opt small{display:block;font-family:var(--f-mono);font-weight:400;font-size:11.5px;color:var(--mute)}
.opt[aria-pressed="true"]{border-color:var(--sand);background:rgba(255,208,141,.16);color:var(--ink)}
.mood{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}
.mood button{height:40px;border-radius:9px;border:1px solid rgba(111,201,222,.22);background:rgba(7,59,87,.55);cursor:pointer;font-family:var(--f-mono);font-size:14px;color:#DDF3F7}
.mood button[aria-pressed="true"]{background:var(--mc);border-color:var(--mc);color:var(--abyss);font-weight:500}
.mood-scale{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute)}
.goalin{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center}
.goalin b{font-family:var(--f-mono);font-weight:500;color:var(--foam);text-align:center}
.sug{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sug .lbl{font-size:12px;color:var(--mute)}
.chipbtn{background:rgba(11,183,183,.12);border:1px solid rgba(11,183,183,.3);color:#6CE3D7;border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;text-align:left;max-width:100%;overflow-wrap:anywhere}
.chipbtn:hover{background:rgba(11,183,183,.24)}
.chipbtn.sand{background:rgba(255,208,141,.1);border-color:rgba(255,208,141,.35);color:var(--sand)}
.yc{display:flex;flex-direction:column;gap:16px;min-width:0}
.yc.upd{gap:0}
.yc-title{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.yc-title h2,.upd-h span{display:block}
.yc-title h2::first-letter,.upd-h span::first-letter{text-transform:uppercase}
.yc-sec,.upd{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 16px 55px rgba(0,9,30,.21)}
.yc-h{margin:0;padding:13px 20px;background:rgba(11,183,183,.10);border-bottom:1px solid var(--line);font-size:16px;font-weight:800}
.upd-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.yc-body,.upd-body{padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.yc-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.yc-body.yc-2{display:grid}
.ql{font-size:13px;color:#C9E3EA;font-weight:700}
.yc-goals{display:flex;flex-direction:column;gap:8px}
.yc-goal{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:9px 12px;border-radius:10px;background:rgba(0,28,59,.45);border:1px solid rgba(137,207,220,.14);font-weight:400;color:var(--ink);font-size:14.5px}
.yc-goal .num{color:var(--foam)}
.yc-goal .t{min-width:0;overflow-wrap:anywhere}
.yc-add{display:grid;grid-template-columns:1fr auto;gap:8px}
.delta-t{font-weight:500;color:var(--mute);margin-left:0!important}
.in:disabled{opacity:.75;cursor:default}
.upd-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));text-align:center;padding:16px 20px;border-bottom:1px solid var(--line);gap:8px}
.upd-stats .k{display:block;font-size:12.5px;color:var(--mute);font-weight:700}
.upd-stats b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.upd-stats small{font-size:12px;font-weight:700}
.upd-stats.sm{padding:4px 0 0;border:0}
.upd-stats.sm b{font-size:18px}
.upd-q{font-size:15.5px;font-weight:700;margin-bottom:8px}
.upd-q small{font-weight:400;color:var(--mute);font-size:12.5px;margin-left:6px}
.upd-a{font-family:var(--f-body);font-size:14px;line-height:1.55;color:#D7E9EE;white-space:pre-wrap;overflow-wrap:anywhere}
.revform{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.5fr) minmax(0,.8fr) minmax(0,1.2fr) auto;gap:8px;align-items:end}
@media (max-width:760px){.revform{grid-template-columns:1fr 1fr}.revform .btn{grid-column:1/-1}}
.revlist{display:flex;flex-direction:column;gap:6px}
.revitem{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;background:rgba(255,208,141,.1);border:1px solid rgba(255,208,141,.3);font-size:14px}
.revitem b{font-family:var(--f-mono);font-weight:500;color:var(--sand)}
.delta{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:rgba(11,183,183,.1);border:1px solid rgba(11,183,183,.25);font-size:14px}
.delta b{font-family:var(--f-mono);font-weight:500}
.su-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid rgba(111,201,222,.21);background:rgba(7,59,87,.7);color:#E6F8FC;cursor:pointer;font-weight:800;min-height:40px;font-size:13px}
.btn:hover{background:rgba(17,114,139,.75);border-color:var(--foam)}
.btn.primary{color:#002837;background:linear-gradient(100deg,#14D0BE,var(--mint));border-color:transparent;box-shadow:0 7px 24px rgba(11,183,183,.19)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.xl{padding:14px 26px;font-size:16px}
.btn.small{padding:5px 11px;min-height:32px;font-size:13px;font-weight:500}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.x-btn{background:none;border:0;color:var(--mute);cursor:pointer;padding:4px 6px;border-radius:6px;font-size:12.5px}
.x-btn:hover{color:var(--coral)}
.link{background:none;border:0;color:var(--foam);cursor:pointer;padding:0;font-size:13px;text-decoration:underline;text-underline-offset:3px}

/* goals checklist */
.list{display:flex;flex-direction:column;gap:8px}
.goalrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:13px 14px;border-radius:12px;background:rgba(0,28,59,.45);border:1px solid rgba(137,207,220,.14);cursor:pointer}
.goalrow:hover{border-color:rgba(11,183,183,.45)}
.goalrow.done{background:rgba(11,183,183,.12);border-color:rgba(11,183,183,.3)}
.goalrow.done .gt{text-decoration:line-through;color:var(--mute)}
.gt{font-size:16px;min-width:0;overflow-wrap:anywhere}
.goalrow.sm{padding:10px 12px}
.goalrow.sm .gt{font-size:14px}
.check{appearance:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--foam);display:grid;place-items:center;cursor:pointer;margin:0;flex:0 0 auto;background:transparent}
.check.sm{width:21px;height:21px;border-radius:6px}
.check:checked{background:var(--foam)}
.check:checked::after{content:"";width:6px;height:11px;border:solid var(--abyss);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check.sm:checked::after{width:5px;height:9px}
.pips{display:flex;gap:6px;align-items:center}
.pip{width:22px;height:6px;border-radius:4px;background:rgba(157,187,200,.2)}
.pip.on{background:var(--foam)}
.perfectbox{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:linear-gradient(100deg,rgba(20,208,190,.22),rgba(106,225,204,.08));border:1px solid rgba(106,225,204,.4);font-weight:700}
.addg{display:grid;grid-template-columns:1fr auto;gap:8px}
.obstacle{font-size:13.5px;color:#C9E3EA;font-family:var(--f-body)}
.obstacle b{color:var(--coral);font-family:var(--f-display)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{padding:12px;border-radius:12px;background:rgba(0,28,59,.45);border:1px solid rgba(137,207,220,.12);min-width:0}
.stat .v{font-size:24px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .k{font-size:12px;color:var(--mute)}
.learned{display:flex;flex-direction:column;gap:8px}
.learned div{font-family:var(--f-body);font-size:13.5px;line-height:1.55;padding-left:12px;border-left:2px solid var(--lilac);color:#D7E9EE}
.learned small{display:block;font-family:var(--f-display);color:var(--mute);font-size:11.5px}

/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:#06415A;border:1px solid rgba(19,212,193,.45);border-radius:10px;padding:6px 10px;font-size:12.5px;white-space:nowrap;transform:translate(-50%,calc(-100% - 12px));box-shadow:0 8px 20px rgba(0,0,0,.35);z-index:3}
.tip b{font-family:var(--f-mono);font-weight:500;display:block}
.tip span{color:var(--mute);font-size:11.5px}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.mini h3{font-size:14px;margin-bottom:6px}
details.data summary{cursor:pointer;color:var(--mute);font-size:12.5px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
.tbl th,.tbl td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--mute);font-weight:500}
.scrollx{overflow-x:auto}

/* pipeline (simple CRM) */
.crm{gap:16px;margin-top:16px}
.crm-sum{display:flex;gap:8px;flex-wrap:wrap}
.crm-sum .chip b{font-family:var(--f-mono);font-weight:500;color:var(--sand)}
.fu-box{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:12px;background:rgba(255,208,141,.08);border:1px solid rgba(255,208,141,.32)}
.fu-list{display:flex;gap:8px;flex-wrap:wrap}
.fu{display:inline-flex;gap:6px;align-items:center;max-width:100%;padding:6px 11px;border-radius:999px;border:1px solid rgba(255,208,141,.4);background:rgba(0,28,59,.5);color:var(--ink);cursor:pointer;font-size:13px;text-align:left}
.fu:hover{border-color:var(--sand)}
.fu.late{border-color:rgba(237,74,109,.6)}
.fu span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fu small{color:var(--mute);white-space:nowrap}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.stage{min-height:210px;background:var(--well);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;align-content:start;scroll-snap-align:start}
.stage.won{border-color:rgba(106,225,204,.35)}
.stage-h{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--foam)}
.stage.won .stage-h{color:var(--mint)}
.stage-h span:first-child{flex:1;min-width:0}
.stage-h .num{color:var(--mute);font-size:12px;letter-spacing:0;text-transform:none;white-space:nowrap}
.stage-sum{font-size:12px;color:var(--sand);margin-top:-4px}
.stage-h .x-btn{font-size:17px;line-height:1;padding:0 6px}
.stage-h .x-btn:hover{color:var(--foam)}
.stage-empty{font-size:12.5px;color:var(--mute);padding:6px 2px}
.deal{display:flex;flex-direction:column;gap:6px;padding:10px 11px;border-radius:11px;background:rgba(6,45,70,.72);border:1px solid rgba(137,207,220,.16);min-width:0}
.deal-t{display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere}
.deal-t b{font-weight:800;font-size:14px}
.deal-t small,.deal-n{font-size:12.5px;color:#B1D5DD;overflow-wrap:anywhere}
.deal-v{font-size:13px;color:var(--sand)}
.deal-v small{color:var(--mute)}
.deal-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.due{font-size:11.5px;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid rgba(147,170,186,.4);color:var(--mute)}
.due.late{background:rgba(237,74,109,.16);border-color:rgba(237,74,109,.6);color:#FFB3C4}
.due.today{background:rgba(255,208,141,.14);border-color:rgba(255,208,141,.5);color:var(--sand)}
.age{font-size:11.5px;color:var(--mute)}
.deal-a{display:flex;gap:4px;align-items:center}
.deal-a .sp{flex:1}
.deal-a .x-btn{border:1px solid rgba(137,207,220,.18);min-width:30px;min-height:30px}
.deal-a .x-btn:disabled{opacity:.3;cursor:default}
.deal-a .x-btn:not(:disabled):hover{color:var(--foam);border-color:var(--foam)}
.deal-form{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:11px;background:rgba(0,28,59,.7);border:1px solid rgba(28,211,211,.35)}
.deal-form textarea.in{min-height:56px}
.deal-fa{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.deal-fa .sp{flex:1}
.lostbox{display:flex;flex-direction:column;gap:6px}
.deal{cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.deal.drag-src{opacity:.3}
.deal.ghost{position:fixed;z-index:1000;margin:0;pointer-events:none;cursor:grabbing;transform:rotate(2deg);box-shadow:0 18px 44px rgba(0,9,30,.55);border-color:var(--foam)}
.stage{transition:border-color .12s,background .12s}
.stage.over{border-color:var(--foam);background:rgba(11,183,183,.12);box-shadow:inset 0 0 0 1px var(--foam)}
.lost-zone{display:none;align-items:center;justify-content:center;padding:14px;border-radius:12px;border:1px dashed rgba(237,74,109,.6);color:#FFB3C4;font-size:13.5px}
.lost-zone.over{background:rgba(237,74,109,.16);border-style:solid}
body.dragging{user-select:none;-webkit-user-select:none}
body.dragging,body.dragging *{cursor:grabbing!important}
body.dragging .lost-zone{display:flex}

/* more */
.more-toggle{display:flex;justify-content:space-between;align-items:center;width:100%;margin-block:16px;padding:14px 16px;border-radius:14px;border:1px dashed var(--line);background:transparent;color:var(--mute);cursor:pointer;font-weight:500;text-align:left}
.more-toggle:hover{color:var(--ink);border-color:var(--foam);background:rgba(11,183,183,.06)}
.more-toggle span{font-family:var(--f-mono)}
details.card > summary{cursor:pointer;list-style:none;font-weight:800;font-size:17px;display:flex;justify-content:space-between;gap:8px}
details.card > summary::-webkit-details-marker{display:none}
details.card > summary::after{content:"+";color:var(--mute);font-family:var(--f-mono)}
details.card[open] > summary::after{content:"−"}
.idea{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;background:rgba(0,28,59,.45);font-size:14px}
.idea span{min-width:0;overflow-wrap:anywhere}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(255,208,141,.14);color:var(--sand);white-space:nowrap}

/* coach */
.msgs{display:flex;flex-direction:column;gap:10px;max-height:min(55vh,520px);overflow-y:auto}
.msg{max-width:94%;padding:10px 13px;border-radius:14px;font-family:var(--f-body);font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:rgba(11,183,183,.14);border:1px solid rgba(11,183,183,.35);border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:rgba(0,22,57,.65);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .by{display:block;font-family:var(--f-display);font-size:11px;color:var(--mute);margin-top:6px}
.tasksug{display:flex;flex-direction:column;gap:6px;margin-top:8px;white-space:normal}
.tasksug button{text-align:left;font-family:var(--f-display);font-size:13px;background:rgba(255,208,141,.1);border:1px dashed rgba(255,208,141,.6);color:var(--ink);border-radius:9px;padding:7px 10px;cursor:pointer}
.tasksug button[disabled]{opacity:.55;cursor:default;border-style:solid}
.composer{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.copybox{min-height:110px;font-family:var(--f-mono);font-size:12px}

.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:15;display:inline-flex;align-items:center;gap:8px;padding:13px 20px;border-radius:999px;border:0;background:linear-gradient(100deg,#14D0BE,var(--mint));color:#002837;font-weight:700;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.fab kbd{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:5px;background:rgba(0,22,57,.15)}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(0,10,30,.6);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.overlay .sheet{width:min(520px,100%);background:linear-gradient(160deg,#06415A,#001B39 85%);box-shadow:0 20px 50px rgba(0,0,0,.5);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;border:1px solid rgba(11,183,183,.3)}
@media (min-width:700px){.overlay{align-items:center}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#074F63;border:1px solid rgba(19,212,193,.45);font-weight:700;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.4)}

@media (max-width:820px){.cols{grid-template-columns:1fr}}
@media (max-width:600px){
  .scene canvas{height:280px}.scene{min-height:280px}
  .top img{height:36px}
  .bottom{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pill.xl{padding:8px 12px;font-size:11.5px}
  .pill.xl b{font-size:22px}
  .chip.save span:last-child{display:none}
  .chip.save{padding:10px}
  .mood{grid-template-columns:repeat(5,minmax(0,1fr))}
  .stats{grid-template-columns:1fr 1fr 1fr}
  .stat .v{font-size:20px}
  .card{padding:16px}
  .su-sec{padding:13px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
(function(){
"use strict";
/* The server injects window.__LINEUP__ = {config, strings} before this script (see app/dashboard/route.ts).
   tr() looks a Spanish source string up in the active language; Spanish returns the key itself. */
const L=window.__LINEUP__||{config:{},strings:{}},CFG=L.config||{},DICT=L.strings||{};
const MET=Object.assign({short:"MRR",long:"MRR",goal:20000},CFG.metric),CUR=CFG.currency||"$",LOCALE=CFG.locale||LOCALE;
const tr=(k,p)=>{let t=DICT[k]!=null?DICT[k]:k;return p?t.replace(/\{(\w+)\}/g,(m,n)=>p[n]!=null?p[n]:m):t};
document.documentElement.lang=CFG.lang||"es";
/* ---------- helpers ---------- */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>Array.from(el.querySelectorAll(s));
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>(n<0?"-":"")+CUR+Math.round(Math.abs(n)).toLocaleString("en-US");
const kmoney=n=>{const a=Math.abs(n),s=(n<0?"-":"")+CUR;if(a>=1e9)return s+(a/1e9).toFixed(a%1e9?1:0)+"B";if(a>=1e6)return s+(a/1e6).toFixed(a%1e6?1:0)+"M";if(a>=1e3)return s+(a/1e3).toFixed(a%1e3&&a<1e4?1:0)+"K";return money(n)};
const pad=n=>String(n).padStart(2,"0");
const dayKey=(d=new Date())=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseDay=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d,12)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const reduced=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function weekStart(d=new Date()){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return x}
function isoWeek(d=new Date()){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=t.getUTCFullYear();return y+"-W"+pad(Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7))}
const fmtDay=k=>parseDay(k).toLocaleDateString(LOCALE,{weekday:"short",day:"numeric",month:"short"});
const fmtShort=k=>parseDay(k).toLocaleDateString(LOCALE,{day:"numeric",month:"short"});
const moodColor=v=>v==null?"var(--mute)":v<=3?"#ED4A6D":v<=5?"#E89A5E":v<=7?"#FFD08D":"#6AE1CC";

/* ---------- rules ---------- */
const GOAL=+MET.goal||20000;
const DEFAULTS={startMRR:0,monthlyCosts:0};

/* ---------- state ---------- */
const state={config:structuredClone(DEFAULTS),reports:{},weeks:{},tasks:[],chats:[],deals:[],mode:"connecting",
  editing:false,draft:null,more:false,readOnly:false,loaded:{reports:false,weeks:false,config:false},wkEdit:null,
  talk:{id:null,draft:"",model:"",busy:false,stream:"",copy:false,fresh:false}};
let db=null,sample=null;
function cfg(){return Object.assign({},DEFAULTS,state.config||{})}

/* ---------- persistence ---------- */
const LS="lineup-v1";
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({config:state.config,reports:state.reports,weeks:state.weeks,tasks:state.tasks,chats:state.chats,deals:state.deals}))}catch(e){}}
function loadLocal(){try{const r=JSON.parse(localStorage.getItem(LS)||"null");if(r){state.config=r.config||state.config;state.reports=r.reports||{};state.weeks=r.weeks||{};state.tasks=r.tasks||[];state.chats=r.chats||[];state.deals=r.deals||[]}}catch(e){}}
const chains={};let pending=0;
function setSave(k,t){$("#saveDot").className="dot "+k;$("#saveTxt").textContent=t}
function queue(path,fn){
  pending++;setSave("busy",tr("Guardando"));
  chains[path]=(chains[path]||Promise.resolve()).then(fn).then(()=>{pending--;if(!pending)setSave("ok",tr("Guardado"))},
    e=>{pending--;const c=e&&e.code;if(c==="invalid_argument"){state.readOnly=true;setSave("off",tr("Solo lectura"))}else if(c==="quota_exceeded"){setSave("off",tr("Lleno"));toast(tr("El almacenamiento está lleno."))}else{setSave("off",tr("Sin guardar"));toast(tr("Ese cambio no se guardó. Intenta de nuevo."))}});
}
function put(coll,id,data){if(state.mode==="db")queue(coll+"/"+id,()=>db.doc(coll+"/"+id).set(JSON.parse(JSON.stringify(data))));else saveLocal()}
function del(coll,id){if(state.mode==="db")queue(coll+"/"+id,()=>db.doc(coll+"/"+id).delete());else saveLocal()}
let cfgTimer=null;
function saveConfig(){clearTimeout(cfgTimer);cfgTimer=setTimeout(()=>{cfgTimer=null;put("game","config",state.config)},450);if(state.mode!=="db")saveLocal()}
const DRAFT_LS="lineup-draft";
function saveDraft(){try{if(state.draft)localStorage.setItem(DRAFT_LS,JSON.stringify(state.draft));else localStorage.removeItem(DRAFT_LS)}catch(e){}}
function loadDraft(){try{const d=JSON.parse(localStorage.getItem(DRAFT_LS)||"null");return d&&d.date===dayKey()?d:null}catch(e){return null}}

/* ---------- derived ---------- */
const reportsSorted=()=>Object.values(state.reports).filter(r=>r&&r.date).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
function revDelta(r){let d=0;(r.revenue||[]).forEach(x=>{const a=+x.amount||0;if(x.kind==="churn")d-=a;else if(x.kind!=="once")d+=a});return d}
function mrrThrough(k){let m=+cfg().startMRR||0;for(const r of reportsSorted()){if(r.date>k)break;if(r.mrr!=null&&!isNaN(+r.mrr))m=+r.mrr;else m+=revDelta(r)}return m}
function lastBefore(k){const rs=reportsSorted().filter(r=>r.date<k);return rs[rs.length-1]||null}
function derive(){
  const c=cfg(),now=new Date(),tk=dayKey(now),wid=isoWeek(now),mk=tk.slice(0,7),rs=reportsSorted();
  const mrr=mrrThrough("9999-12-31");let firstPay=mrr>0||rs.some(r=>+r.mrr>0),onceMonth=0;
  rs.forEach(r=>{(r.revenue||[]).forEach(x=>{if(x.kind!=="churn")firstPay=true;if(x.kind==="once"&&r.date.slice(0,7)===mk)onceMonth+=+x.amount||0})});
  const costs=+c.monthlyCosts||0,profit=mrr+onceMonth-costs,gap=Math.max(0,GOAL-mrr);
  const wk=rs.filter(r=>isoWeek(parseDay(r.date))===wid);
  const talkWk=wk.reduce((s,r)=>s+(+r.talked||0),0);
  const moods=wk.map(r=>r.morale).filter(v=>v!=null);
  const moodAvg=moods.length?moods.reduce((a,b)=>a+b,0)/moods.length:null;
  let streak=0;const d=new Date();if(!state.reports[dayKey(d)])d.setDate(d.getDate()-1);
  for(let i=0;i<400;i++){const wd=d.getDay();if(wd===0||wd===6){d.setDate(d.getDate()-1);continue}if(state.reports[dayKey(d)]){streak++;d.setDate(d.getDate()-1)}else break}
  const perfect=rs.filter(r=>r.goals&&r.goals.length&&r.goals.every(g=>g.done)).length;
  const mrrWeekStart=mrrThrough(dayKey(new Date(weekStart(now).getTime()-864e5)));
  return {c,mrr,firstPay,profit,costs,gap,wk,talkWk,moodAvg,streak,perfect,mrrWeekStart,today:state.reports[tk]||null,tk,wid};
}
function milestones(c){return (CFG.milestones||[]).map(m=>{
  const metric=m.type==="first"?"first":m.type==="profit"?"profit":"mrr",v=metric==="first"?1:+m.value||0;
  const label=m.label||(metric==="first"?tr("Primer cliente"):kmoney(v)+" "+(metric==="profit"?tr("de utilidad"):MET.short));
  return {label,metric,v}}).filter(m=>m.v>0)}
function msState(D){
  const ms=milestones(D.c);let idx=ms.length;
  ms.forEach((m,i)=>{const val=m.metric==="first"?(D.firstPay?1:0):m.metric==="profit"?D.profit:D.mrr;m.done=val>=m.v;if(!m.done&&idx===ms.length)idx=i});
  const cur=ms[Math.min(idx,ms.length-1)];let p=1;
  if(idx<ms.length){if(cur.metric==="first")p=0;else{const val=cur.metric==="profit"?D.profit:D.mrr;let prev=0;for(let j=idx-1;j>=0;j--)if(ms[j].metric===cur.metric){prev=ms[j].v;break}p=clamp((val-prev)/(cur.v-prev),0,1)}}
  return {ms,idx,cur,p};
}
function nextMrrTarget(mrr){
  const goals=milestones(cfg()).filter(m=>m.metric==="mrr").map(m=>m.v).sort((a,b)=>a-b);
  for(const v of goals)if(mrr<v)return v;return null}

let toastT=null;
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3400)}

/* ---------- ocean canvas ---------- */
const Ocean=(function(){
  const cv=$("#ocean"),ctx=cv.getContext("2d");let W=0,H=0,dpr=1,t=0,raf=null;
  let p=0,ps=0,tp=0,tps=0,boost=0,parts=[],ms=[],msIdx=0,geo=null;const stars=[];
  for(let i=0;i<60;i++)stars.push([Math.random(),Math.random()*0.5,Math.random()]);
  function size(){const r=cv.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  function sky(){
    // Deep teal surf sky with a soft glow near the horizon.
    const g=ctx.createLinearGradient(0,0,W*0.4,H*0.6);
    g.addColorStop(0,"#0B5575");g.addColorStop(0.5,"#0D7694");g.addColorStop(1,"#052E62");
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    const hz=ctx.createLinearGradient(0,H*0.3,0,H*0.56);hz.addColorStop(0,"rgba(255,229,168,0)");hz.addColorStop(1,"rgba(255,229,168,.16)");
    ctx.fillStyle=hz;ctx.fillRect(0,H*0.3,W,H*0.26);
    ctx.strokeStyle="rgba(177,242,236,.18)";ctx.lineWidth=4;ctx.lineCap="round";
    for(const [cx,cy,s] of [[0.08,0.24,1],[0.55,0.16,0.8]]){const x=W*cx,y=H*cy,k=28*s;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+k*0.5,y-k*0.36,x+k,y);ctx.quadraticCurveTo(x+k*1.5,y-k*0.36,x+k*2,y);ctx.stroke()}
  }
  function islandX(i,n){return n>1?W*(0.42+0.52*i/(n-1)):W*0.8}
  function sun(hy){
    // the sun rises over the island of your next milestone
    const x=W*0.86,y=hy-34,r=20+Math.sin(t*1.2)*0.8;
    const halo=ctx.createRadialGradient(x,y,r*0.6,x,y,r*3.2);halo.addColorStop(0,"rgba(255,208,141,.55)");halo.addColorStop(1,"rgba(255,208,141,0)");
    ctx.fillStyle=halo;ctx.beginPath();ctx.arc(x,y,r*3.2,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="rgba(255,208,141,.7)";ctx.lineWidth=2;ctx.lineCap="round";
    for(let k=0;k<10;k++){const a=k/10*Math.PI*2+t*0.15;ctx.beginPath();ctx.moveTo(x+Math.cos(a)*(r+5),y+Math.sin(a)*(r+5));ctx.lineTo(x+Math.cos(a)*(r+11),y+Math.sin(a)*(r+11));ctx.stroke()}
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle="#FFD08D";ctx.fill();
  }
  function islands(hy){
    const n=ms.length;if(!n)return;
    for(let i=0;i<n;i++){
      const x=islandX(i,n),w=10+i*3,h=4+i*1.6;
      ctx.beginPath();ctx.moveTo(x-w,hy);ctx.quadraticCurveTo(x,hy-h*2,x+w,hy);ctx.closePath();
      ctx.fillStyle=ms[i].done?"#13C9AA":(i===msIdx?"#0E9A90":"rgba(0,64,100,.75)");ctx.fill();
    }
  }
  /* Wave geometry. Side view of an OPEN wave travelling right: a steep, clean face with the lip
     just starting to feather at the top (not yet broken). Height A grows with progress. */
  function amp(v){return Math.min(H*(0.16+0.4*v),W*0.34,H-100)}
  function geom(A,cx,base){return {A,cx,base,L:A*2.8}}
  function slopeY(g,x,ph){const x0=Math.max(0,g.cx-g.L);let s=(x-x0)/Math.max(1,g.cx-x0);s=clamp(s,0,1);const sm=s*s*(3-2*s);return g.base-g.A*sm+Math.sin(x*0.03+ph)*2.2*(1-sm)}
  function facePts(g){const {A,cx,base}=g;return [[cx+0.17*A,base-0.8*A],[cx+0.42*A,base-0.42*A],[cx+0.85*A,base-0.02*A],[cx+1.6*A,base]]}
  function bez(P,u){const m=1-u,c=[m*m*m,3*m*m*u,3*m*u*u,u*u*u],d=[-3*m*m,3*m*m-6*m*u,6*m*u-3*u*u,3*u*u];let x=0,y=0,dx=0,dy=0;for(let i=0;i<4;i++){x+=c[i]*P[i][0];y+=c[i]*P[i][1];dx+=d[i]*P[i][0];dy+=d[i]*P[i][1]}return {x,y,dx,dy}}
  function body(g,ph,flick){
    const {A,cx,base}=g,P=new Path2D(),F=facePts(g),fl=flick||0;P.moveTo(0,H);
    for(let x=0;x<cx;x+=4)P.lineTo(x,slopeY(g,x,ph));
    P.lineTo(cx,base-A);
    // feathering lip: a short throw forward, then back into the face
    P.bezierCurveTo(cx+0.14*A,base-1.0*A,cx+0.27*A,base-(0.97+fl)*A,cx+0.31*A,base-0.88*A);
    P.bezierCurveTo(cx+0.27*A,base-0.86*A,cx+0.2*A,base-0.84*A,F[0][0],F[0][1]);
    P.bezierCurveTo(F[1][0],F[1][1],F[2][0],F[2][1],F[3][0],F[3][1]);
    for(let x=F[3][0];x<=W+6;x+=6)P.lineTo(x,base+Math.sin(x*0.035-ph)*2);
    P.lineTo(W,H);P.closePath();return P;
  }
  function surfer(x,y,ang,s){
    ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.scale(s,s);
    ctx.beginPath();ctx.ellipse(0,0,20,3.4,0,0,Math.PI*2);ctx.fillStyle="#FFD08D";ctx.fill();
    ctx.fillStyle="#ED4A6D";ctx.fillRect(-15,-1,3,2);
    ctx.rotate(-ang*0.6);
    ctx.strokeStyle="#E9F5F7";ctx.lineWidth=2.8;ctx.lineCap="round";ctx.lineJoin="round";
    ctx.beginPath();
    ctx.moveTo(-8,-2);ctx.lineTo(-6,-9);ctx.lineTo(-1,-13);
    ctx.moveTo(7,-2);ctx.lineTo(8,-9);ctx.lineTo(-1,-13);
    ctx.moveTo(-1,-13);ctx.lineTo(2,-21);

/* ---------- header ---------- */
/* the MRR counts up from $0 when the page opens (slow at first, then faster), then just follows the data */
let mrrTarget=0,mrrRaf=0,mrrState="idle";
function showMrr(v){$("#critBig").innerHTML=money(v)+' <small>/ '+kmoney(GOAL)+' '+tr("al mes")+'</small>'}
function countMrr(target){
  mrrTarget=target;
  if(mrrState==="running")return;
  if(mrrState==="idle"&&state.loaded.reports&&state.loaded.config&&!reduced&&target>0){
    mrrState="running";const t0=performance.now(),dur=2800,K=5.5;
    const tick=now=>{const u=Math.min(1,(now-t0)/dur);showMrr(mrrTarget*(Math.exp(K*u)-1)/(Math.exp(K)-1));
      if(u<1)mrrRaf=requestAnimationFrame(tick);else{mrrState="done";showMrr(mrrTarget)}};
    mrrRaf=requestAnimationFrame(tick);return;
  }
  if(state.loaded.reports&&state.loaded.config&&mrrState==="idle")mrrState="done";
  showMrr(target);
}

function splitLines(s){return String(s||"").split("\n").map(x=>x.replace(/^\s*(?:[-*•]|\d+[.)])\s*/,"").trim()).filter(Boolean)}
function needsWeekGoals(){const wk=state.weeks[isoWeek()]||{};return !(wk.goals&&wk.goals.length)}
/* keeps a draft in step with the week: asked only while the week has no goals (unless being edited here) */

function newDraft(){
  const k=dayKey(),ex=state.reports[k];
  const weekGoals=needsWeekGoals()?[]:null;
  const prevMrr=ex?mrrBefore(k):mrrThrough(k);
  if(ex)return {date:k,talked:String(ex.talked||0),learned:ex.learned||"",mrr:String(mrrThrough(k)),morale:ex.morale==null?"":String(ex.morale),improved:ex.improved||"",obstacle:ex.obstacle||"",goals:(ex.goals||[]).map(g=>g.t),weekGoals,prevMrr};
  return {date:k,talked:"",learned:"",mrr:String(prevMrr),morale:"",improved:"",obstacle:"",goals:[],weekGoals,prevMrr};
}
function mrrBefore(k){const l=lastBefore(k);return l?mrrThrough(l.date):(+cfg().startMRR||0)}
function suggestions(){
  const out=[],seen=new Set(),d=state.draft,have=new Set(((d&&d.goals)||[]).map(t=>t.toLowerCase())),add=(t,src)=>{const k=t.toLowerCase();if(t&&!seen.has(k)&&!have.has(k)){seen.add(k);out.push([t,src])}};
  const last=lastBefore(dayKey());if(last)(last.goals||[]).filter(g=>!g.done).forEach(g=>add(g.t,"ayer"));
  const wk=state.weeks[isoWeek()]||{};(wk.goals||[]).filter(g=>!g.done).forEach(g=>add(g.t,"semana"));

/* ---------- charts (single series each, one axis each) ---------- */
const CH={};
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function daysBack(n){const out=[],d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-(n-1));for(let i=0;i<n;i++){out.push(dayKey(d));d.setDate(d.getDate()+1)}return out}
function chartFrame(w,h,L,R,T,B,ymax,ticks,fmt){
  const y=v=>T+(h-T-B)*(1-v/ymax);
  return ticks.map(t=>`<line x1="${L}" x2="${w-R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="rgba(147,170,186,.16)"/><text x="${L-8}" y="${(y(t)+4).toFixed(1)}" text-anchor="end" fill="#93AABA" font-size="11" font-family="DM Sans, sans-serif">${fmt(t)}</text>`).join("");
}
function mrrChart(){
  const ks=daysBack(56),pts=ks.map(k=>({k,v:mrrThrough(k)})),last=pts[pts.length-1].v,cw=chartW();
  const tgt=nextMrrTarget(Math.max(last,0)),top=Math.max(...pts.map(p=>p.v),tgt||0,1000);
  const W=cw,H=Math.round(clamp(cw*0.5,190,260)),L=54,R=18,T=18,B=28,ymax=niceMax(top*1.05);
  const x=i=>L+(W-L-R)*i/(pts.length-1),y=v=>T+(H-T-B)*(1-Math.max(0,v)/ymax);
  let d="M"+x(0).toFixed(1)+","+y(pts[0].v).toFixed(1);
  for(let i=1;i<pts.length;i++)d+="H"+x(i).toFixed(1)+"V"+y(pts[i].v).toFixed(1);
  const area=d+"V"+y(0).toFixed(1)+"H"+x(0).toFixed(1)+"Z";
  const lbl=(cw<520?[0,28,55]:[0,14,28,42,55]).map(i=>`<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="${i===0?"start":i===55?"end":"middle"}" fill="#93AABA" font-size="11" font-family="DM Sans, sans-serif">${i===55?tr("hoy"):fmtShort(ks[i])}</text>`).join("");
  CH.mrr={pts:pts.map((p,i)=>({x:x(i),y:y(p.v),t:money(p.v)+tr("/mes"),s:fmtDay(p.k)})),W,H};
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(tr("{metric} de los últimos 56 días: {value} hoy",{metric:MET.short,value:money(last)}))}" data-chart="mrr">
    ${chartFrame(W,H,L,R,T,B,ymax,[0,ymax/2,ymax],kmoney)}
    ${tgt?`<line x1="${L}" x2="${W-R}" y1="${y(tgt).toFixed(1)}" y2="${y(tgt).toFixed(1)}" stroke="#FFD08D" stroke-opacity=".55" stroke-dasharray="5 6" stroke-width="1.5"/><text x="${W-R}" y="${(y(tgt)-7).toFixed(1)}" text-anchor="end" fill="#C9E3EA" font-size="11.5" font-family="DM Sans, sans-serif">${esc(tr("Siguiente meta {amount}",{amount:kmoney(tgt)}))}</text>`:""}
    <path d="${area}" fill="#19D7C7" fill-opacity=".14"/><path d="${d}" fill="none" stroke="#19D7C7" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${x(pts.length-1).toFixed(1)}" cy="${y(last).toFixed(1)}" r="5" fill="#19D7C7" stroke="#03284A" stroke-width="2"/>
    <text x="${(x(pts.length-1)-10).toFixed(1)}" y="${(y(last)-12).toFixed(1)}" text-anchor="end" fill="#F5FDFF" font-size="13" font-weight="700" font-family="DM Sans, sans-serif">${money(last)}</text>
    ${lbl}${hoverLayer(L,T,W-R,H-B)}</svg>`;
}
function barsChart(){
  const ks=daysBack(14),W=miniW(),H=180,L=30,R=8,T=14,B=26,vals=ks.map(k=>state.reports[k]?(+state.reports[k].talked||0):null);
  const ymax=Math.max(4,Math.ceil(Math.max(...vals.map(v=>v||0))/2)*2),bw=(W-L-R)/ks.length,y=v=>T+(H-T-B)*(1-v/ymax);
  CH.talk={pts:ks.map((k,i)=>({x:L+bw*(i+.5),y:vals[i]?y(vals[i]):y(0),t:vals[i]==null?tr("sin standup"):vals[i]+" "+(vals[i]===1?tr("persona"):tr("personas")),s:fmtDay(k)})),W,H};
  const bars=vals.map((v,i)=>{if(!v)return "";const x0=L+bw*i+2,w=Math.max(2,bw-4),yt=y(v),yb=y(0),r=Math.min(4,w/2,yb-yt);
    return `<path d="M${x0.toFixed(1)},${yb}V${(yt+r).toFixed(1)}Q${x0.toFixed(1)},${yt.toFixed(1)} ${(x0+r).toFixed(1)},${yt.toFixed(1)}H${(x0+w-r).toFixed(1)}Q${(x0+w).toFixed(1)},${yt.toFixed(1)} ${(x0+w).toFixed(1)},${(yt+r).toFixed(1)}V${yb}Z" fill="#009FD5"/>`}).join("");
  const lbl=[0,7,13].map(i=>`<text x="${(L+bw*(i+.5)).toFixed(1)}" y="${H-8}" text-anchor="${i===0?"start":i===13?"end":"middle"}" fill="#93AABA" font-size="10.5" font-family="DM Sans, sans-serif">${i===13?tr("hoy"):fmtShort(ks[i])}</text>`).join("");

}
function moodChart(){
  const ks=daysBack(14),W=miniW(),H=180,L=30,R=12,T=14,B=26,ymax=10,vals=ks.map(k=>state.reports[k]&&state.reports[k].morale!=null?state.reports[k].morale:null);

  let d="",prev=false;vals.forEach((v,i)=>{if(v==null){prev=false;return}d+=(prev?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1);prev=true});
  const dots=vals.map((v,i)=>v==null?"":`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4" fill="#FFD08D" stroke="#03284A" stroke-width="2"/>`).join("");
  const lbl=[0,7,13].map(i=>`<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="${i===0?"start":i===13?"end":"middle"}" fill="#93AABA" font-size="10.5" font-family="DM Sans, sans-serif">${i===13?tr("hoy"):fmtShort(ks[i])}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(tr("Tu moral, últimos 14 días"))}" data-chart="mood">${chartFrame(W,H,L,R,T,B,ymax,[0,5,10],v=>String(v))}<path d="${d}" fill="none" stroke="#FFD08D" stroke-width="2" stroke-linejoin="round"/>${dots}${lbl}${hoverLayer(L,T,W-R,H-B)}</svg>`;

function chartW(){const p=$("#panel"),pw=p&&p.clientWidth||640;const col=pw>820?(pw-16)/2:pw;return Math.round(clamp(col-(window.innerWidth<600?34:42),260,1040))}
function miniW(){return chartW()}
function hoverLayer(x0,y0,x1,y1){return `<g class="hov" visibility="hidden" pointer-events="none"><line y1="${y0}" y2="${y1}" stroke="rgba(245,253,255,.35)" stroke-width="1"/><circle r="5" fill="#F5FDFF" stroke="#03284A" stroke-width="2"/></g><rect class="hit" x="${x0}" y="${y0-10}" width="${x1-x0}" height="${y1-y0+10}" fill="transparent"/>`}

function chartHover(e){
  const svg=e.target.closest&&e.target.closest("svg[data-chart]");if(!svg)return;

  const p=c.pts[best],g=svg.querySelector(".hov"),tip=svg.parentNode.querySelector(".tip");
  g.setAttribute("visibility","visible");g.querySelector("line").setAttribute("x1",p.x);g.querySelector("line").setAttribute("x2",p.x);

const STAGES=[["idea",tr("Idea")],["prospecto",tr("Prospecto")],["conversacion",tr("En conversación")],["propuesta",tr("Propuesta")],["cliente",tr("Cliente")]];
const STAGE_KEYS=STAGES.map(x=>x[0]);
const crm={adding:null,editing:null,lost:false};
const dueKey=d=>d.due||"9999-99-99";
function dealsIn(stage){return state.deals.filter(d=>d.stage===stage).sort((a,b)=>dueKey(a)<dueKey(b)?-1:dueKey(a)>dueKey(b)?1:(a.created||0)-(b.created||0))}
function crmStats(){
  const t=dayKey(),open=state.deals.filter(d=>STAGE_KEYS.includes(d.stage)&&d.stage!=="cliente");
  return {open:open.length,value:open.reduce((n,d)=>n+(+d.value||0),0),clients:state.deals.filter(d=>d.stage==="cliente"),

    if(d.goal!=null){const k=dayKey(),r=state.reports[k];if(!r)return;const goals=r.goals.map(g=>Object.assign({},g));goals[+d.goal].done=t.checked;const r2=Object.assign({},r,{goals});
      state.reports=Object.assign({},state.reports,{[k]:r2});put("reports",k,r2);
      if(t.checked){const all=goals.every(g=>g.done);Ocean.burst(all?2.2:1);toast(all?tr("¡Día perfecto! Todas tus metas listas."):tr("Meta lista. Sigue remando."))}}
    else{const wid=isoWeek(),w=Object.assign({},state.weeks[wid]||{}),goals=(w.goals||[]).map(g=>Object.assign({},g));goals[+d.wgoal].done=t.checked;w.goals=goals;
      state.weeks=Object.assign({},state.weeks,{[wid]:w});put("weeks",wid,w);if(t.checked){Ocean.burst(1.6);toast(tr("¡Meta de la semana cumplida!"))}}
    render();return}
  if(d.d&&state.draft){state.draft[d.d]=t.value;saveDraft();return}
  if(d.talkmodel){state.talk.model=t.value;try{localStorage.setItem("lineup-model",t.value)}catch(x){}return}
  if(d.cfg){const v=parseFloat(t.value);if(isNaN(v))return;state.config=Object.assign({},cfg(),{[d.cfg]:v});saveConfig();render();return}
});
panel.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target,fd=Object.fromEntries(new FormData(f).entries()),k=f.dataset.form;
  if(k==="addgoal"){if(addTodayGoal(fd.t)){render();setTimeout(()=>{const i=$("#t-addgoal");if(i)i.focus()},60)}return}
  if(k==="deal"){saveDeal(f,fd);return}
  if(k==="idea"){addIdea(fd.t);const i=$("#t-idea");if(i){i.value="";i.focus()}return}
});
panel.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target&&e.target.dataset&&e.target.dataset.addin){e.preventDefault();addGoalFrom(e.target.dataset.addin);return}if(e.target&&e.target.id==="talk-in"&&e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();sendTalk()}});
/* drag and drop: pointer events, so a mouse drags at once and a finger drags after a short press */
const drag={pend:null,on:null};
function dropOn(id,stage){
  const d=state.deals.find(x=>x.id===id);if(!d||d.stage===stage)return;
  if(state.readOnly){toast(tr("Esta vista es solo de lectura."));return}
  if(stage==="perdido")loseDeal(id,false);
  else if(STAGE_KEYS.includes(stage))upsertDeal(Object.assign({},d,{stage,stageAt:Date.now(),updated:Date.now()}),d.stage);
}
function stageUnder(x,y){
  for(const el of document.elementsFromPoint(x,y)){const st=el.closest&&el.closest("[data-stage]");if(st)return st}
  const b=$(".board");if(!b)return null;const br=b.getBoundingClientRect();
  if(y<br.top-30||y>br.bottom+30)return null;
  return $$(".stage",b).find(st=>{const r=st.getBoundingClientRect();return x>=r.left&&x<=r.right})||null;
}
function dragTo(x,y){
  const g=drag.on;if(!g)return;g.x=x;g.y=y;
  g.ghost.style.left=(x-g.dx)+"px";g.ghost.style.top=(y-g.dy)+"px";
  const st=stageUnder(x,y),key=st?st.dataset.stage:null;
  if(key!==g.over){$$("[data-stage].over").forEach(el=>el.classList.remove("over"));if(st)st.classList.add("over");g.over=key}
}
function dragLoop(){
  const g=drag.on;if(!g)return;
  const b=$(".board");
  if(b){const r=b.getBoundingClientRect();if(g.y>r.top-40&&g.y<r.bottom+40){if(g.x<r.left+50)b.scrollLeft-=14;else if(g.x>r.right-50)b.scrollLeft+=14}}
  if(g.y<70)window.scrollBy(0,-12);else if(g.y>innerHeight-70)window.scrollBy(0,12);
  dragTo(g.x,g.y);g.raf=requestAnimationFrame(dragLoop);
}
function dragStart(x,y){
  const p=drag.pend;if(!p||drag.on)return;
  const r=p.el.getBoundingClientRect(),ghost=p.el.cloneNode(true);
  ghost.classList.add("ghost");ghost.removeAttribute("data-id");ghost.style.width=r.width+"px";ghost.style.left=r.left+"px";ghost.style.top=r.top+"px";
  document.body.appendChild(ghost);p.el.classList.add("drag-src");document.body.classList.add("dragging");
  drag.on={id:p.id,el:p.el,ghost,dx:p.x-r.left,dy:p.y-r.top,x,y,over:null,raf:0};
  dragLoop();
}
function dragEnd(commit){
  const g=drag.on,p=drag.pend;if(p)clearTimeout(p.timer);
  drag.on=null;drag.pend=null;
  if(g){cancelAnimationFrame(g.raf);g.ghost.remove();g.el.classList.remove("drag-src");$$("[data-stage].over").forEach(el=>el.classList.remove("over"))}
  document.body.classList.remove("dragging");
  if(commit&&g&&g.over)dropOn(g.id,g.over);
}
function dealTarget(t){
  const el=t.closest&&t.closest(".deal");
  return el&&!t.closest("button,input,select,textarea,a")&&el.dataset.id&&!state.readOnly?el:null;
}
panel.addEventListener("pointerdown",e=>{
  if(e.pointerType==="touch"||(e.pointerType==="mouse"&&e.button!==0))return;
  const el=dealTarget(e.target);if(!el)return;
  drag.pend={id:el.dataset.id,el,pid:e.pointerId,x:e.clientX,y:e.clientY};
});
document.addEventListener("pointermove",e=>{
  const p=drag.pend;if(!p||p.touch||e.pointerId!==p.pid)return;
  if(drag.on){dragTo(e.clientX,e.clientY);return}
  if(Math.hypot(e.clientX-p.x,e.clientY-p.y)>6)dragStart(e.clientX,e.clientY);
});
document.addEventListener("pointerup",e=>{
  const p=drag.pend;if(!p||p.touch||e.pointerId!==p.pid)return;
  if(drag.on){dragTo(e.clientX,e.clientY);dragEnd(true)}else{clearTimeout(p.timer);drag.pend=null}
});
document.addEventListener("pointercancel",e=>{const p=drag.pend;if(p&&!p.touch&&(drag.on||e.pointerId===p.pid))dragEnd(false)});
/* a finger drags after a short press; a quick swipe still scrolls */
panel.addEventListener("touchstart",e=>{
  if(e.touches.length!==1){dragEnd(false);return}
  const el=dealTarget(e.target);if(!el)return;
  const t=e.touches[0],p={id:el.dataset.id,el,touch:true,x:t.clientX,y:t.clientY};
  p.timer=setTimeout(()=>{if(drag.pend===p)dragStart(p.x,p.y)},320);
  drag.pend=p;
},{passive:true});
document.addEventListener("touchmove",e=>{
  const p=drag.pend;if(!p||!p.touch)return;const t=e.touches[0];
  if(drag.on){e.preventDefault();dragTo(t.clientX,t.clientY);return}
  if(Math.hypot(t.clientX-p.x,t.clientY-p.y)>10){clearTimeout(p.timer);drag.pend=null}
},{passive:false});
document.addEventListener("touchend",e=>{
  const p=drag.pend;if(!p||!p.touch)return;
  if(drag.on){const t=e.changedTouches[0];if(t)dragTo(t.clientX,t.clientY);dragEnd(true)}else{clearTimeout(p.timer);drag.pend=null}
});
document.addEventListener("touchcancel",()=>{if(drag.pend&&drag.pend.touch)dragEnd(false)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&drag.on)dragEnd(false)});

/* ---------- boot ---------- */
try{state.talk.model=localStorage.getItem("lineup-model")||"";state.more=localStorage.getItem("lineup-more")==="1"}catch(e){}
applyStatic();Ocean.start();render();
const use=window.claude&&typeof window.claude.use==="function"?n=>window.claude.use(n).catch(()=>null):()=>Promise.resolve(null);
use("sample").then(s=>{sample=s});
use("user").then(async u=>{if(u){try{if(await u.isOwner()===false){state.readOnly=true;render()}}catch(e){}}});
use("db").then(d=>{
  if(!d){state.mode="local";loadLocal();state.loaded.reports=state.loaded.weeks=state.loaded.config=true;setSave("ok",tr("En este navegador"));render();return}
  db=d;state.mode="db";setSave("ok",tr("Sincronizado"));
  const err=e=>setSave("off",e&&e.code==="revoked"?tr("Sin conexión"):tr("Sincronización en pausa"));
  db.doc("game/config").onSnapshot(s=>{if(cfgTimer)return;state.config=s.exists?s.data():structuredClone(DEFAULTS);state.loaded.config=true;render()},err);
  db.collection("reports").onSnapshot(s=>{const o={};s.docs.forEach(x=>o[x.id]=x.data());state.reports=o;state.loaded.reports=true;render()},err);
  db.collection("weeks").onSnapshot(s=>{const o={};s.docs.forEach(x=>o[x.id]=x.data());state.weeks=o;state.loaded.weeks=true;syncDraftWeek(state.draft);render()},err);
  setTimeout(()=>{if(!(state.loaded.reports&&state.loaded.weeks&&state.loaded.config)){state.loaded.reports=state.loaded.weeks=state.loaded.config=true;render()}},8000);
  db.collection("tasks").onSnapshot(s=>{state.tasks=s.docs.map(x=>x.data());render()},err);
  db.collection("deals").onSnapshot(s=>{state.deals=s.docs.map(x=>x.data());render()},err);
  db.collection("chats").onSnapshot(s=>{state.chats=s.docs.map(x=>x.data());const c=state.chats.slice().sort((a,b)=>(b.updated||0)-(a.updated||0))[0];if(!state.talk.id&&!state.talk.fresh&&!state.talk.busy&&c)state.talk.id=c.id;render()},err);
});
})();
</script>
